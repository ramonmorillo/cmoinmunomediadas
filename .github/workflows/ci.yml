name: CI

on:
  pull_request:
  push:
    branches: [claude/dazzling-wozniak-p1sx1g]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas, build y E2E
    # Ubuntu 24.04 fijado: Playwright 1.56 no soporta aún ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas unitarias
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Instalar Playwright (Chromium) y axe-core
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium

      - name: Pruebas E2E (con auditoría WCAG A/AA)
        env:
          AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
        run: npm run test:e2e
